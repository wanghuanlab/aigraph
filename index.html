<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V18a1 1 0 0 1-2 0v-.07A8.006 8.006 0 0 1 4.07 13H5a1 1 0 0 1 0-2h-.93A8.006 8.006 0 0 1 11 4.07V5a1 1 0 0 1 2 0v-.93A8.006 8.006 0 0 1 19.93 11H19a1 1 0 0 1 0 2h.93A8.006 8.006 0 0 1 13 19.93z'/></svg>"
    />
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("aigraph-theme") || "system";
        } catch {}
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIGraph | 人工智能全栈知识图谱与实战研习社</title>
    <meta
      name="description"
      content="AIGraph，人工智能全栈知识图谱与实战研习社。通过知识图谱连接 AI 文章、手册、知识点与学习速查；当前收录 Python 语言下人工智能训练师三级的部分实操与知识内容。"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
